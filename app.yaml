command:
  - "python"
  - "app.py"

env:
  # --- Lakebase --------------------------------------------------------
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # Alternative to the two above: bind the secret directly so the DSN
  # arrives as an environment variable and the app never calls the secrets
  # API. Needs the secret added as a resource on the app first (Edit ->
  # Resources -> Add resource -> Secret, resource key "lakebase-url").
  # - name: LAKEBASE_URL
  #   valueFrom: lakebase-url

  # --- National Weather Service -----------------------------------------
  # api.weather.gov requires a descriptive User-Agent with contact info; a
  # generic one gets 403'd. No API key needed.
  - name: NWS_USER_AGENT
    value: "lakebase-weather-rag (bootcamp homework; contact via github.com/DolfusNegunda)"
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: WEATHER_DEFAULT_LOCATIONS
    value: "Chicago, IL|Austin, TX|Miami, FL"

  # --- Embeddings ----------------------------------------------------------
  - name: EMBEDDING_MODEL_NAME
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: EMBEDDING_DIM
    value: "384"
  # Written by the app container at boot; the app's home directory is not
  # writable, but /tmp is.
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/.cache/sentence-transformers"

  # --- Optional: RAG summary via a Databricks Foundation Model ------------
  - name: FOUNDATION_MODEL_ENDPOINT
    value: "databricks-meta-llama-3-1-70b-instruct"
